# .github/workflows/deploy-js-bot.yml

name: Deploy JS Bot to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Node.js dependencies
      run: npm install

    - name: Trigger Render Deployment
      run: curl -X POST ${{ secrets.RENDER_JS_DEPLOY_HOOK_URL }}
